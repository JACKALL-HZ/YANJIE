[project]
name = "yanjie-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "langgraph>=0.6,<1",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "python-dotenv>=1.0,<2",
    "sse-starlette>=2.1,<3",
    "sqlalchemy>=2.0,<3",
    "chromadb>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",
    "rank-bm25>=0.2,<1",
    "mcp>=1.0,<2",
    "bcrypt>=4.0,<5",
    "pyjwt>=2.8,<3",
    # 生产数据库（PostgreSQL + LangGraph PostgresSaver checkpointer）
    "psycopg[binary]>=3.1,<4",
    "langgraph-checkpoint-postgres>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
    "live: opt-in tests that call configured external providers",
]

[tool.setuptools.packages.find]
include = ["app*"]
